<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商商品价格自动化采集与对比工具</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 Element Plus -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- 引入 Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .search-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .charts-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .chart-box { flex: 1; height: 400px; border: 1px solid #ebeef5; border-radius: 4px; padding: 10px; }
        .recommend-tag { color: #f56c6c; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="header">
            <h2>🛒 电商商品价格自动化采集与对比工具</h2>
            <p style="color: #666; font-size: 14px;">自动抓取主流电商平台价格数据，并进行清洗、去重与性价比分析</p>
        </div>

        <div class="search-bar">
            <el-input v-model="keyword" placeholder="请输入商品关键词，如 iPhone 15" style="width: 400px;" @keyup.enter="handleSearch"></el-input>
            <el-switch v-model="useMock" active-text="模拟演示(免反爬)" inactive-text="真实抓取"></el-switch>
            <el-button type="primary" :loading="loading" @click="handleSearch">开始采集与分析</el-button>
        </div>

        <div v-if="dataList.length > 0">
            <!-- 图表区域 -->
            <div class="charts-container">
                <div id="scatterChart" class="chart-box"></div>
                <div id="barChart" class="chart-box"></div>
            </div>

            <!-- 数据表格 -->
            <el-table :data="dataList" style="width: 100%" border stripe height="500">
                <el-table-column prop="platform" label="平台" width="100">
                    <template #default="scope">
                        <el-tag :type="getPlatformType(scope.row.platform)">{{ scope.row.platform }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="title" label="商品名称" min-width="300" show-overflow-tooltip>
                    <template #default="scope">
                        <a :href="scope.row.url" target="_blank" style="color: #409EFF; text-decoration: none;">{{ scope.row.title }}</a>
                    </template>
                </el-table-column>
                <el-table-column prop="price" label="价格 (元)" width="120" sortable>
                    <template #default="scope">
                        <span style="color: #f56c6c; font-weight: bold;">¥ {{ scope.row.price.toFixed(2) }}</span>
                    </template>
                </el-table-column>
                <el-table-column prop="sales" label="销量" width="120" sortable></el-table-column>
                <el-table-column prop="rating" label="店铺评分" width="120" sortable></el-table-column>
                <el-table-column label="性价比推荐" width="150" align="center">
                    <template #default="scope">
                        <span v-if="scope.row.recommended" class="recommend-tag">⭐ 推荐购买</span>
                        <span v-else style="color: #ccc;">-</span>
                    </template>
                </el-table-column>
            </el-table>
        </div>
        <el-empty v-else description="暂无数据，请在上方输入关键词开始采集"></el-empty>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        const app = createApp({
            setup() {
                const keyword = ref('iPhone 15');
                const useMock = ref(true);
                const loading = ref(false);
                const dataList = ref([]);
                let scatterChart = null;
                let barChart = null;

                // 初始化时提供一组示例数据
                const initMockData = () => {
                    dataList.value = [
                        {"id": "jd_1", "platform": "京东", "title": "【京东自营】iPhone 15 128G 黑色", "price": 4999, "sales": 12000, "rating": 4.9, "url": "#", "score": 0.85, "recommended": true},
                        {"id": "tb_1", "platform": "淘宝", "title": "【淘宝】苹果15 现货速发", "price": 4850, "sales": 5000, "rating": 4.6, "url": "#", "score": 0.72, "recommended": false},
                        {"id": "pdd_1", "platform": "拼多多", "title": "【百亿补贴】iPhone 15", "price": 4599, "sales": 35000, "rating": 4.5, "url": "#", "score": 0.92, "recommended": true},
                        {"id": "jd_2", "platform": "京东", "title": "Apple iPhone 15 (A3092)", "price": 5299, "sales": 8000, "rating": 4.8, "url": "#", "score": 0.65, "recommended": false},
                    ];
                    renderCharts();
                };

                const getPlatformType = (platform) => {
                    if (platform.includes('京东')) return 'danger';
                    if (platform.includes('淘宝')) return 'warning';
                    if (platform.includes('拼多多')) return 'success';
                    return 'info';
                };

                const handleSearch = async () => {
                    if (!keyword.value) {
                        ElementPlus.ElMessage.warning('请输入关键词');
                        return;
                    }
                    loading.value = true;
                    try {
                        const res = await axios.post('/api/search', {
                            keyword: keyword.value,
                            use_mock: useMock.value
                        });
                        if (res.data.status === 'success') {
                            dataList.value = res.data.data;
                            ElementPlus.ElMessage.success(`采集完成！共清洗出 ${dataList.value.length} 条数据`);
                            nextTick(() => {
                                renderCharts();
                            });
                        }
                    } catch (error) {
                        ElementPlus.ElMessage.error('采集请求失败，请检查后端服务');
                        console.error(error);
                    } finally {
                        loading.value = false;
                    }
                };

                const renderCharts = () => {
                    if (!dataList.value.length) return;
                    
                    // 渲染散点图 (价格-销量-评分)
                    if (!scatterChart) {
                        scatterChart = echarts.init(document.getElementById('scatterChart'));
                    }
                    
                    const scatterData = dataList.value.map(item => {
                        return [
                            item.price,      // x轴: 价格
                            item.sales,      // y轴: 销量
                            item.rating,     // 气泡大小基准
                            item.platform,
                            item.title,
                            item.recommended ? 1 : 0
                        ];
                    });

                    const scatterOption = {
                        title: { text: '价格-销量-性价比气泡图', left: 'center', textStyle: { fontSize: 14 } },
                        tooltip: {
                            formatter: function (params) {
                                const data = params.value;
                                return `平台: ${data[3]}<br/>名称: ${data[4]}<br/>价格: ¥${data[0]}<br/>销量: ${data[1]}<br/>评分: ${data[2]}`;
                            }
                        },
                        xAxis: { name: '价格(元)', type: 'value', scale: true },
                        yAxis: { name: '销量', type: 'value', scale: true },
                        series: [{
                            type: 'scatter',
                            symbolSize: function (data) { return Math.max(10, data[2] * 4); },
                            itemStyle: {
                                color: function(params) {
                                    // 推荐商品用红色高亮，其他用普通蓝色
                                    return params.value[5] === 1 ? '#f56c6c' : '#409EFF';
                                },
                                opacity: 0.7
                            },
                            data: scatterData
                        }]
                    };
                    scatterChart.setOption(scatterOption);

                    // 渲染柱状图 (各平台均价对比)
                    if (!barChart) {
                        barChart = echarts.init(document.getElementById('barChart'));
                    }
                    
                    const platformStats = {};
                    dataList.value.forEach(item => {
                        if (!platformStats[item.platform]) {
                            platformStats[item.platform] = { sum: 0, count: 0, min: item.price };
                        }
                        platformStats[item.platform].sum += item.price;
                        platformStats[item.platform].count += 1;
                        if (item.price < platformStats[item.platform].min) {
                            platformStats[item.platform].min = item.price;
                        }
                    });

                    const platforms = Object.keys(platformStats);
                    const avgPrices = platforms.map(p => (platformStats[p].sum / platformStats[p].count).toFixed(2));
                    const minPrices = platforms.map(p => platformStats[p].min);

                    const barOption = {
                        title: { text: '各平台价格对比', left: 'center', textStyle: { fontSize: 14 } },
                        tooltip: { trigger: 'axis' },
                        legend: { data: ['平均价格', '最低价格'], bottom: 0 },
                        xAxis: { type: 'category', data: platforms },
                        yAxis: { type: 'value', name: '价格(元)' },
                        series: [
                            { name: '平均价格', type: 'bar', data: avgPrices, itemStyle: { color: '#E6A23C' } },
                            { name: '最低价格', type: 'bar', data: minPrices, itemStyle: { color: '#67C23A' } }
                        ]
                    };
                    barChart.setOption(barOption);
                };

                onMounted(() => {
                    initMockData();
                    // 窗口改变时图表自适应
                    window.addEventListener('resize', () => {
                        if (scatterChart) scatterChart.resize();
                        if (barChart) barChart.resize();
                    });
                });

                return {
                    keyword, useMock, loading, dataList, handleSearch, getPlatformType
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
